name: Release 2 validation

on:
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.route.outputs.full }}
      workshop: ${{ steps.route.outputs.workshop }}
      install: ${{ steps.route.outputs.install }}
      omr: ${{ steps.route.outputs.omr }}
      visual: ${{ steps.route.outputs.visual }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - id: route
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import subprocess
          subprocess.check_call(["git","fetch","--no-tags","--depth=1","origin",os.environ["PULL_REQUEST_BASE_SHA"]])
          paths=set(subprocess.check_output(["git","diff","--name-only",os.environ["PULL_REQUEST_BASE_SHA"],os.environ["PULL_REQUEST_HEAD_SHA"]],text=True).splitlines())
          targeted={".github/workflows/r2-tests.yml",".github/workflows/piano-deploy.yml","README.md","index.html","sw.js","song-import.js","my-songs.js","piano-hero-v2.css","r2-music.js","r2-install.js","scripts/create-r2-install-manifest.py","tests/r2-workshop-review.cjs","tests/r2-install-gate.cjs","tests/r2-on-demand-installer.cjs","tests/r2-sw-update.cjs","tests/fixtures/sw-v1.18.1.js","tests/r2-omr-ground-truth.cjs","tests/r2-visual-gallery.cjs","tests/piano-hero-crystal-visual.cjs","tests/android-landscape-controls.cjs","tests/neon-label-impact.cjs","tests/r2-integration.test.js","tests/r2-music.test.js","pwa-update.js"}
          print("full=" + str(bool(paths-targeted)).lower())
          print("workshop=" + str(bool(paths & {"song-import.js","tests/r2-workshop-review.cjs"})).lower())
          print("install=" + str(bool(paths & {"index.html","sw.js","r2-install.js","scripts/create-r2-install-manifest.py","tests/r2-on-demand-installer.cjs",".github/workflows/piano-deploy.yml"})).lower())
          print("omr=" + str(bool(paths & {"omr-worker.js","song-import.js","tests/r2-omr-ground-truth.cjs",".github/workflows/piano-deploy.yml"})).lower())
          print("visual=" + str(bool(paths & {"index.html","piano-hero-v2.css","tests/piano-hero-crystal-visual.cjs","tests/android-landscape-controls.cjs","tests/neon-label-impact.cjs"})).lower())
          PY
  validate:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check r2-music.js
          node --check r2-image.js
          node --check r2-install.js
          node --check pwa-update.js
          node --check tests/pwa-update.test.js
          node --check tests/r2-on-demand-installer.cjs
          node --check tests/r2-sw-update.cjs
          node --check song-import.js
          node --check my-songs.js
          node --check tests/r2-music.test.js
          node --check tests/r2-integration.test.js
          node --check tests/r2-browser-smoke.cjs
          node --check tests/r2-omr-ground-truth.cjs
          node --check tests/r2-fastpath-recovery.cjs
          node --check tests/r2-workshop-review.cjs
          node --check tests/piano-hero-crystal-visual.cjs
      - name: Test difficulty and arrangement rules
        run: node --test tests/r2-music.test.js tests/r2-image.test.js tests/r2-integration.test.js tests/pwa-update.test.js
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Install Chromium for headless acceptance
        run: npx playwright install chromium
      - name: Test integrated browser behavior
        env:
          APP_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tests/r2-browser-smoke.cjs
      - name: Upload playback state screenshots
        uses: actions/upload-artifact@v4
        with:
          name: playback-state-evidence-${{ github.event.pull_request.head.sha }}
          path: /tmp/piano-playback-state-*.png
          retention-days: 14
          if-no-files-found: error
      - name: Test score correction and arrangement playback
        run: node tests/r2-workshop-review.cjs

  workshop-targeted:
    needs: changes
    if: needs.changes.outputs.workshop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run focused Add New Song, minimized processing and playback checks
        env:
          APP_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tests/r2-workshop-review.cjs
      - name: Verify local photo pre-scan and page-only recovery
        run: node tests/r2-fastpath-recovery.cjs
      - name: Upload fast-path responsive screenshots and recovery recording
        uses: actions/upload-artifact@v4
        with:
          name: fastpath-recovery-responsive-evidence-${{ github.event.pull_request.head.sha }}
          path: /tmp/fastpath-evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Upload Android-sized selector screenshot
        uses: actions/upload-artifact@v4
        with:
          name: android-song-selector-open-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/android-song-selector-open.png
            /tmp/issue25-minimized-processing-390x844-${{ github.event.pull_request.head.sha }}.png
            /tmp/magic-music-progress-portrait-${{ github.event.pull_request.head.sha }}.png
            /tmp/magic-music-progress-landscape-${{ github.event.pull_request.head.sha }}.png
            /tmp/magic-music-progress-video-${{ github.event.pull_request.head.sha }}.webm
          retention-days: 14
          if-no-files-found: error

  on-demand-installer-targeted:
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check installation scripts
        run: |
          node --check r2-install.js
          node --check tests/r2-on-demand-installer.cjs
          python3 -m py_compile scripts/create-r2-install-manifest.py
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test on-demand OMR integrity, retry, storage and recovery
        run: node tests/r2-on-demand-installer.cjs
      - name: Simulate update from previous production worker without clearing user data
        run: node tests/r2-sw-update.cjs

  visual-gallery:
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check crystal visual and PianoGeometry regressions
        run: |
          node --check tests/piano-hero-crystal-visual.cjs
          node --check tests/android-landscape-controls.cjs
          node --check tests/neon-label-impact.cjs
          node tests/piano-geometry.test.js
      - name: Install Playwright Chromium for screenshot capture
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install chromium
      - name: Capture actual crystal renderer screenshots and recording
        env:
          APP_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tests/piano-hero-crystal-visual.cjs
      - name: Verify Android landscape playback controls at responsive viewports
        env:
          APP_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tests/android-landscape-controls.cjs
      - name: Verify neon note labels and Magical Note Explosion
        env:
          APP_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tests/neon-label-impact.cjs
      - name: Upload crystal visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: piano-hero-crystal-visual-evidence-${{ github.event.pull_request.head.sha }}
          path: piano-hero-crystal-visual-evidence.zip
          retention-days: 14
          if-no-files-found: error
      - name: Upload responsive playback control screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-landscape-controls-evidence-${{ github.event.pull_request.head.sha }}
          path: android-landscape-controls-evidence.zip
          retention-days: 14
          if-no-files-found: error
      - name: Upload neon labels and note impact evidence
        uses: actions/upload-artifact@v4
        with:
          name: neon-label-impact-evidence-${{ github.event.pull_request.head.sha }}
          path: neon-label-impact-evidence.zip
          retention-days: 14
          if-no-files-found: error

  omr-ground-truth:
    needs: changes
    if: needs.changes.outputs.omr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Install Chromium for full local-engine test
        run: npx playwright install --with-deps chromium
      - name: Check out pinned Partsong engine source
        uses: actions/checkout@v4
        with:
          repository: pzfreo/partsong
          ref: 9834842408b3012730b76249e0c3738820a08912
          path: omr-source
          persist-credentials: false
      - name: Fetch pinned local runtime and model pack
        run: |
          cd omr-source
          bash scripts/fetch-libs.sh
          bash scripts/fetch-models.sh
          cd ..
      - name: Stage the same local OMR payload used by Pages
        run: |
          mkdir -p _site/assets/release2 _site/assets/piano-hero-v2 _site/vendor/omr-licenses _site/omr _site/models _site/lib/onnxruntime-web@1.30.0
          cp index.html song-import.js my-songs.js r2-music.js r2-image.js r2-install.js pwa-update.js sw.js piano-geometry.js piano-hero-v2.css manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png _site/
          cp assets/release2/magic-book.svg assets/release2/magic-bubble.svg _site/assets/release2/
          cp assets/piano-hero-v2/home_button.png assets/piano-hero-v2/settings_button.png _site/assets/piano-hero-v2/
          cp omr-source/omr-worker.js _site/
          cp -R omr-source/omr/. _site/omr/
          cp -R omr-source/models/. _site/models/
          cp -R omr-source/lib/onnxruntime-web@1.30.0/. _site/lib/onnxruntime-web@1.30.0/
          cp OMR-THIRD-PARTY-NOTICES.md _site/
          cp omr-source/LICENSE _site/vendor/omr-licenses/partsong-LICENSE
          touch _site/.nojekyll
          python3 scripts/create-r2-install-manifest.py
      - name: Stage the pull-request base as a matched OMR benchmark baseline
        env:
          FASTPATH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$FASTPATH_BASE_SHA"
          git worktree add --detach /tmp/fastpath-base FETCH_HEAD
          mkdir -p /tmp/fastpath-base/_site/assets/release2 /tmp/fastpath-base/_site/assets/piano-hero-v2 /tmp/fastpath-base/_site/vendor/omr-licenses
          cp /tmp/fastpath-base/{index.html,song-import.js,my-songs.js,r2-music.js,r2-image.js,r2-install.js,pwa-update.js,sw.js,piano-geometry.js,piano-hero-v2.css,manifest.webmanifest,icon-192.png,icon-512.png,icon-maskable-512.png,apple-touch-icon.png,OMR-THIRD-PARTY-NOTICES.md} /tmp/fastpath-base/_site/
          cp /tmp/fastpath-base/assets/release2/{magic-book.svg,magic-bubble.svg} /tmp/fastpath-base/_site/assets/release2/
          cp /tmp/fastpath-base/assets/piano-hero-v2/{home_button.png,settings_button.png} /tmp/fastpath-base/_site/assets/piano-hero-v2/
          cp -R _site/omr _site/models _site/lib /tmp/fastpath-base/_site/
          cp _site/omr-worker.js _site/release2-install-manifest.json /tmp/fastpath-base/_site/
          cp _site/vendor/omr-licenses/partsong-LICENSE /tmp/fastpath-base/_site/vendor/omr-licenses/
          touch /tmp/fastpath-base/_site/.nojekyll
      - name: Measure matched baseline with the pinned local OMR engine
        env:
          FASTPATH_RUN_LABEL: baseline
        run: node tests/r2-omr-ground-truth.cjs /tmp/fastpath-base/_site | tee /tmp/fastpath-baseline.log
      - name: Measure candidate with the same fixture and runner
        env:
          FASTPATH_RUN_LABEL: candidate
        run: node tests/r2-omr-ground-truth.cjs _site | tee /tmp/fastpath-candidate.log
      - name: Upload Android processing screenshots and OMR recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastpath-omr-benchmark-evidence-${{ github.event.pull_request.head.sha }}
          path: /tmp/fastpath-evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Upload temporary owner review site
        if: always() && hashFiles('_site/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-2-v1-review-site
          path: _site/
          retention-days: 7
          if-no-files-found: error
