name: Release 2 validation

on:
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check r2-music.js
          node --check r2-image.js
          node --check song-import.js
          node --check my-songs.js
          node --check tests/r2-music.test.js
          node --check tests/r2-integration.test.js
          node --check tests/r2-browser-smoke.cjs
          node --check tests/r2-omr-ground-truth.cjs
      - name: Test difficulty and arrangement rules
        run: node --test tests/r2-music.test.js tests/r2-image.test.js tests/r2-integration.test.js
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Install Chromium for headless acceptance
        run: npx playwright install chromium
      - name: Test integrated browser behavior
        run: node tests/r2-browser-smoke.cjs
      - name: Test existing piano geometry
        run: node tests/piano-geometry.test.js
      - name: Validate supplied SVG assets
        run: python -c "import xml.etree.ElementTree as ET; [ET.parse(p) for p in ['assets/release2/magic-book.svg','assets/release2/magic-bubble.svg']]"

  omr-ground-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Install Chromium for full local-engine test
        run: npx playwright install --with-deps chromium
      - name: Check out pinned Partsong engine source
        uses: actions/checkout@v4
        with:
          repository: pzfreo/partsong
          ref: 9834842408b3012730b76249e0c3738820a08912
          path: omr-source
          persist-credentials: false
      - name: Fetch pinned local runtime and model pack
        run: |
          cd omr-source
          bash scripts/fetch-libs.sh
          bash scripts/fetch-models.sh
          cd ..
      - name: Stage the same local OMR payload used by Pages
        run: |
          mkdir -p _site/assets/release2 _site/assets/piano-hero-v2 _site/vendor/omr-licenses _site/omr _site/models _site/lib/onnxruntime-web@1.30.0
          cp index.html song-import.js my-songs.js r2-music.js r2-image.js sw.js piano-geometry.js piano-hero-v2.css manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png _site/
          cp assets/release2/magic-book.svg assets/release2/magic-bubble.svg _site/assets/release2/
          cp assets/piano-hero-v2/home_button.png assets/piano-hero-v2/settings_button.png _site/assets/piano-hero-v2/
          cp omr-source/omr-worker.js _site/
          cp -R omr-source/omr/. _site/omr/
          cp -R omr-source/models/. _site/models/
          cp -R omr-source/lib/onnxruntime-web@1.30.0/. _site/lib/onnxruntime-web@1.30.0/
          cp OMR-THIRD-PARTY-NOTICES.md _site/
          cp omr-source/LICENSE _site/vendor/omr-licenses/partsong-LICENSE
          touch _site/.nojekyll
      - name: Test known score recognition online and offline
        run: node tests/r2-omr-ground-truth.cjs _site
      - name: Upload temporary owner review site
        if: always() && hashFiles('_site/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-2-v1-review-site
          path: _site/
          retention-days: 7
          if-no-files-found: error
