name: Phase 1 — Magic Star wheel owner review

on:
  pull_request:
    branches: [main]
    paths:
      - v2.1-ui.js
      - v2.1-ui.css
      - assets/v2.1-magic-wheel/**
      - tests/magic-star-phase1.cjs
      - .github/workflows/v21-ui-validation.yml

permissions:
  contents: read

jobs:
  phase1-magic-star:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install chromium
      - name: Test wheel interactions and capture owner-review evidence
        env:
          APP_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node tests/magic-star-phase1.cjs
      - name: Upload Phase 1 owner-review ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AARIA_MAGIC_STAR_PHASE1_OWNER_REVIEW
          path: AARIA_MAGIC_STAR_PHASE1_OWNER_REVIEW.zip
          retention-days: 30
          if-no-files-found: error
