name: V2.1 — Android UI correction acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - v2.1-ui.js
      - v2.1-ui.css
      - assets/v2.1-magic-wheel/**
      - tests/magic-star-phase1.cjs
      - tests/android-v2111-ui.cjs
      - tests/v2111-final-corrections.cjs
      - index.html
      - my-songs.js
      - sw.js
      - pwa-update.js
      - tests/visual-fixtures/**
      - docs/v2.1/**
      - scripts/package-v21-release2-final.py
      - .github/workflows/v21-ui-validation.yml

permissions:
  actions: read
  contents: read

jobs:
  phase1-magic-star:
    outputs:
      test_result: ${{ steps.v21-test.outcome }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install chromium
      - name: Test Android UI corrections, title editing, and magical lights
        id: v21-test
        env:
          APP_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/AARIA_V2_1_ANDROID_UI_CORRECTIONS/screenshots
          FINAL_EVIDENCE_DIR: ${{ runner.temp }}/AARIA_V2_1_11_FINAL_CORRECTIONS
        run: |
          node tests/android-v2111-ui.cjs
          node tests/v2111-final-corrections.cjs
      - name: Verify final review archive contents
        if: always()
        run: |
          test -s AARIA_V2_1_11_FINAL_CORRECTIONS_OWNER_REVIEW.zip
          unzip -l AARIA_V2_1_11_FINAL_CORRECTIONS_OWNER_REVIEW.zip
          unzip -Z1 AARIA_V2_1_11_FINAL_CORRECTIONS_OWNER_REVIEW.zip | grep -q 'final-manifest.json'
          unzip -Z1 AARIA_V2_1_11_FINAL_CORRECTIONS_OWNER_REVIEW.zip | grep -q 'FUNCTIONAL_RESULTS_V2111_FINAL.md'
          unzip -Z1 AARIA_V2_1_11_FINAL_CORRECTIONS_OWNER_REVIEW.zip | grep -q 'rename-and-magical-lights-interaction.webm'
      - name: Upload V2.1 owner-review ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AARIA_V2_1_11_FINAL_CORRECTIONS_OWNER_REVIEW
          path: AARIA_V2_1_11_FINAL_CORRECTIONS_OWNER_REVIEW.zip
          retention-days: 30
          if-no-files-found: error

  final-review-package:
    needs: [phase1-magic-star]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Wait for exact-source Release 2 workflows
        id: source-runs
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const targets = {r2:423032827, listen:424047526, explosion:424002114};
            const found = {};
            for (let attempt = 0; attempt < 120; attempt++) {
              for (const [key, workflow_id] of Object.entries(targets)) {
                if (found[key]?.status === 'completed') continue;
                const response = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner, repo: context.repo.repo, workflow_id, head_sha: sha, per_page: 20
                });
                const run = response.data.workflow_runs.find(item => item.head_sha === sha);
                if (run) found[key] = run;
              }
              if (Object.keys(targets).every(key => found[key]?.status === 'completed')) break;
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            const output = {};
            for (const key of Object.keys(targets)) {
              const run = found[key];
              output[key] = run ? {id: run.id, name: run.name, conclusion: run.conclusion, url: run.html_url} : null;
              core.info(key + ': ' + (run ? run.status + ' / ' + run.conclusion + ' / ' + run.html_url : 'not found within wait limit'));
            }
            core.setOutput('runs', JSON.stringify(output));
      - name: Download exact-SHA Magic Star evidence
        uses: actions/download-artifact@v4
        with:
          name: AARIA_V2_1_11_FINAL_CORRECTIONS_OWNER_REVIEW
          path: evidence-source/v21
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact-SHA Release 2 evidence
        if: ${{ fromJSON(steps.source-runs.outputs.runs).r2 != null }}
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ github.event.pull_request.head.sha }}"
          path: evidence-source/r2
          run-id: ${{ fromJSON(steps.source-runs.outputs.runs).r2.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify single owner-review archive
        run: |
          test -s evidence-source/v21/AARIA_V2_1_11_FINAL_CORRECTIONS_OWNER_REVIEW.zip
          unzip -t evidence-source/v21/AARIA_V2_1_11_FINAL_CORRECTIONS_OWNER_REVIEW.zip
          unzip -Z1 evidence-source/v21/AARIA_V2_1_11_FINAL_CORRECTIONS_OWNER_REVIEW.zip
