name: V2.1 — Hero portrait and landscape review package

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/package-v21-hero-review.sh
      - .github/workflows/v21-hero-review-package.yml

permissions:
  actions: read
  contents: read

jobs:
  package-owner-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Retrieve completed running-app captures
        uses: actions/download-artifact@v4
        with:
          name: AARIA_V2_1_MAGIC_STAR_COMPACT_CONTROLS_FINAL_OWNER_REVIEW
          path: source-artifact
          run-id: 44852122036
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble exactly four screenshots and one video
        run: bash scripts/package-v21-hero-review.sh
      - name: Verify minimal archive
        run: |
          test "$(unzip -Z1 AARIA_V2_1_HERO_PORTRAIT_LANDSCAPE_REVIEW.zip | wc -l | tr -d ' ')" = 6
          unzip -Z1 AARIA_V2_1_HERO_PORTRAIT_LANDSCAPE_REVIEW.zip
      - name: Upload owner-review package
        uses: actions/upload-artifact@v4
        with:
          name: AARIA_V2_1_HERO_PORTRAIT_LANDSCAPE_REVIEW
          path: AARIA_V2_1_HERO_PORTRAIT_LANDSCAPE_REVIEW.zip
          retention-days: 30
          if-no-files-found: error
