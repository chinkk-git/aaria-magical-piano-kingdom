name: Release 2 Magical Note Explosion

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - tests/r2-note-explosion.cjs
      - .github/workflows/r2-note-explosion.yml

permissions:
  contents: read

jobs:
  note-explosion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: node --check tests/r2-note-explosion.cjs
      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install chromium
      - name: Verify note impacts in the running application
        run: node tests/r2-note-explosion.cjs
      - name: Upload note impact screenshot and recording
        uses: actions/upload-artifact@v4
        with:
          name: r2-magical-note-explosion-${{ github.event.pull_request.head.sha }}
          path: /tmp/r2-note-explosion/
          retention-days: 14
          if-no-files-found: error
