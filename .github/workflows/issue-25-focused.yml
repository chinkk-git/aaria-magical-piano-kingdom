name: Issue 25 focused browser verification

on:
  push:
    branches: [fix/issue-25-add-new-song-piano-hero]

permissions:
  contents: read

jobs:
  focused-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check changed JavaScript and manifest builder
        run: |
          node --check song-import.js
          node --check r2-install.js
          node --check sw.js
          node --check my-songs.js
          node --check tests/r2-workshop-review.cjs
          node --check tests/r2-on-demand-installer.cjs
          node --check tests/r2-sw-update.cjs
          python3 -m py_compile scripts/create-r2-install-manifest.py
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install chromium
      - name: Verify Add New Song, minimize restore, playback and responsive controls
        env:
          APP_SOURCE_SHA: ${{ github.sha }}
        run: node tests/r2-workshop-review.cjs
      - name: Verify on-demand OMR integrity and retained local data
        run: node tests/r2-on-demand-installer.cjs
      - name: Verify previous PWA shell upgrade and preserved songs, favorites, IndexedDB and OMR cache
        run: node tests/r2-sw-update.cjs
      - name: Upload actual application screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-25-actual-browser-screenshots-${{ github.sha }}
          path: /tmp/issue25-*.png
          retention-days: 14
          if-no-files-found: warn
